<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DFIR Browser{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/redesign.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/tree.js" defer></script>
  <script src="/static/triage.js" defer></script>
  <script src="/static/forms.js" defer></script>
  <script src="/static/registry.js" defer></script>
  <script src="/static/evtx.js" defer></script>
  <script src="/static/browser.js" defer></script>
  <script src="/static/preview.js" defer></script>
  <script src="/static/shellbags.js" defer></script>
  <script src="/static/picker.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/" aria-label="DFIR Browser home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
            <path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5v-9Z" stroke="currentColor" stroke-width="1.8"/>
            <path d="M8 10.5h8M8 14h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </span>
        <span>DFIR Browser</span>
      </a>
      <span class="tag">Read-only</span>
      <nav class="primary-nav" aria-label="Primary navigation">
        <a class="nav-link{% if request.url.path == '/' or request.url.path.startswith('/evidence') %} active{% endif %}"
           href="/"{% if request.url.path == '/' %} aria-current="page"{% endif %}>Evidence</a>
        <a class="nav-link{% if request.url.path.startswith('/settings') %} active{% endif %}"
           href="/settings/integrations"{% if request.url.path.startswith('/settings') %} aria-current="page"{% endif %}>Integrations</a>
      </nav>
    </div>
  </header>
  <main id="main-content" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
  <footer>
    <strong>Safe handling reminder.</strong> Evidence is opened read-only. Treat
    filenames, metadata and extracted files as untrusted data.
  </footer>
</body>
</html>
